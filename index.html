<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webprogramming_midterm</title>

    <!-- Reset CSS -->
    <link rel="stylesheet" href="./style/reset.css" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="./style/style.css" />

    <!-- jQuery -->
    <script
      src="https://code.jquery.com/jquery-4.0.0.min.js"
      integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
      crossorigin="anonymous"
    ></script>

    <!-- JavaScript -->
    <script src="./js/script.js" defer></script>
  </head>

  <body>
    <div class="poster">
      <!-- 배경 -->
      <div class="background-light">
        <div class="sky-top">
          <div class="top-left"></div>
          <div class="top-right"></div>
        </div>

        <div class="sky-middle"></div>
        <div class="sky-small"></div>
        <div class="sky-bottom"></div>
      </div>

      <!-- 제목 -->
      <h1 class="title">Seoul Light</h1>

      <!-- 산과 한옥 -->
      <div class="scene">
        <div class="mountain-left">
          <img
            src="./images/hanok-transparent-assets/mountain-left-before.png"
            class="img-fill"
          />
        </div>

        <div class="mountain-right">
          <img
            src="./images/hanok-transparent-assets/mountain-right-before.png"
            class="img-fill"
          />
        </div>

        <div class="hanok">
          <div class="hanok-closed">
            <img
              src="./images/hanok-transparent-assets/hanok_closed.png"
              class="img-fill"
            />
          </div>

          <div class="hanok-open">
            <img
              src="./images/hanok-transparent-assets/hanok_open.png"
              class="img-fill"
            />
          </div>
        </div>
      </div>

      <!-- 물 -->
      <div class="water">
        <div class="water-dot dot-1"></div>
        <div class="water-dot dot-2"></div>
        <div class="water-dot dot-3"></div>
        <div class="water-dot dot-4"></div>
        <div class="water-dot dot-5"></div>
        <div class="water-dot dot-6"></div>
        <div class="water-dot dot-7"></div>
        <div class="water-dot dot-8"></div>

        <div class="water-light"></div>

        <!-- 반사 이미지 -->
        <div class="water-view">
          <div class="water-cut">
            <div class="hanok-water">
              <img
                src="./images/hanok-transparent-assets/hanok-reflection.png"
                class="img-fill"
              />
            </div>
          </div>
        </div>

        <!-- 물을 클릭했을 때 나오는 물결 -->
        <div class="water-wave">
          <img
            src="./images/hanok-transparent-assets/water-wave.svg"
            class="wave-big"
          />

          <img
            src="./images/hanok-transparent-assets/water-wave.svg"
            class="wave-small"
          />
        </div>
      </div>
      <!-- 물 영역 끝 -->

      <!-- 왼쪽 꽃 -->
      <div class="flower-left">
        <img
          src="./images/hanok-transparent-assets/flowers.png"
          class="img-fill"
        />

        <!-- 왼쪽 꽃잎의 물결 -->
        <img
          src="./images/hanok-transparent-assets/water-wave.svg"
          class="flower-wave flower-wave-left wave-1"
        />

        <img
          src="./images/hanok-transparent-assets/water-wave.svg"
          class="flower-wave flower-wave-left wave-2"
        />

        <!-- 왼쪽 꽃잎 -->
        <div class="petal-left petal-1">
          <img
            src="./images/hanok-transparent-assets/petal.png"
            class="img-fill"
          />
        </div>

        <div class="petal-left petal-2">
          <img
            src="./images/hanok-transparent-assets/petal.png"
            class="img-fill"
          />
        </div>
      </div>

      <!-- 오른쪽 꽃 -->
      <div class="flower-right">
        <img
          src="./images/hanok-transparent-assets/flowers-right.png"
          class="img-fill"
        />

        <!-- 오른쪽 꽃잎의 물결 -->
        <img
          src="./images/hanok-transparent-assets/water-wave.svg"
          class="flower-wave flower-wave-right wave-1"
        />

        <img
          src="./images/hanok-transparent-assets/water-wave.svg"
          class="flower-wave flower-wave-right wave-2"
        />

        <img
          src="./images/hanok-transparent-assets/water-wave.svg"
          class="flower-wave flower-wave-right wave-3"
        />

        <!-- 오른쪽 꽃잎 -->
        <div class="petal-right petal-1">
          <img
            src="./images/hanok-transparent-assets/petal.png"
            class="img-fill"
          />
        </div>

        <div class="petal-right petal-2">
          <img
            src="./images/hanok-transparent-assets/petal.png"
            class="img-fill"
          />
        </div>

        <div class="petal-right petal-3">
          <img
            src="./images/hanok-transparent-assets/petal.png"
            class="img-fill"
          />
        </div>
      </div>

      <!-- 축제 이름 -->
      <div class="poster-name">서울 한옥 빛 축제</div>

      <div class="poster-copy">
        <div class="poster-type">SEOUL HANOK LIGHT FESTIVAL</div>
      </div>

      <!-- 세로 문구 -->
      <div class="poster-text">
        <div class="text-first">
          서<br />
          울<br />
          의<br />
          밤<br />
          에,
        </div>

        <div class="text-second">
          빛<br />
          이<br />
          피<br />
          어<br />
          나<br />
          다.
        </div>
      </div>

      <!-- 축제 기간 -->
      <div class="poster-date">
        <div class="poster-label">축제 시작 · OPENING</div>

        <div class="poster-value">
          <div>2026.</div>
          <div>10.24.</div>
        </div>

        <div class="poster-small">19:00 — 22:00</div>
      </div>

      <div class="poster-place">
        <div class="poster-label">축제 종료 · CLOSING</div>

        <div class="poster-value">
          <div>2026.</div>
          <div>10.26.</div>
        </div>

        <div class="poster-small">무료 관람 · 야외 전시</div>
      </div>

      <!-- 축제 장소 -->
      <div class="poster-location">
        <div class="location-en">
          at Gwanghwamun

          <div class="location-info">서울특별시 종로구 세종대로 172</div>
        </div>
      </div>

      <!-- 안내 문구 -->
      <div class="poster-bottom">한옥을 클릭해 빛을 깨워보세요</div>

      <!-- 나비 1 -->
      <div class="butterfly butterfly-1">
        <img
          src="./images/hanok-transparent-assets/butterfly.png"
          class="img-fill butterfly-img"
        />

        <img
          src="./images/hanok-transparent-assets/light.png"
          class="img-fill light-img"
        />
      </div>

      <!-- 나비 2 -->
      <div class="butterfly butterfly-2">
        <img
          src="./images/hanok-transparent-assets/butterfly-02.png"
          class="img-fill butterfly-img"
        />

        <img
          src="./images/hanok-transparent-assets/light-02.png"
          class="img-fill light-img"
        />
      </div>

      <!-- 나비 3 -->
      <div class="butterfly butterfly-3">
        <img
          src="./images/hanok-transparent-assets/butterfly-03.png"
          class="img-fill butterfly-img"
        />

        <img
          src="./images/hanok-transparent-assets/light-03.png"
          class="img-fill light-img"
        />
      </div>
    </div>
    <!-- 포스터 끝 -->

    <!-- 문 여는 소리 -->
    <audio class="door-sound" src="./sound/door-open.mp3"></audio>
  </body>
</html>
